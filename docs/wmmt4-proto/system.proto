syntax = "proto2";
package Sys.protobuf;
message Status {
  required .Sys.protobuf.State state = 1;
  optional string name = 2;
  optional uint32 address = 3;
  optional int32 value = 4;
  optional int32 value2 = 5;
}
message Command {
  optional uint32 sequence = 1;
  optional string ntp = 2;
  optional string check_cable = 3;
  optional string renew_dhcp = 4;
  optional uint32 set_date = 5;
  optional string sync_date = 6;
  repeated uint32 ping = 7;
  optional uint32 trace_route = 8;
  optional string check_packet = 9;
  optional string reboot = 10;
  optional string check_pkg = 11;
}
message Reply {
  optional uint32 sequence = 1;
  optional .Sys.protobuf.Status ntp = 2;
  optional .Sys.protobuf.Status check_cable = 3;
  optional .Sys.protobuf.Status renew_dhcp = 4;
  optional .Sys.protobuf.Status set_date = 5;
  optional .Sys.protobuf.Status sync_date = 6;
  repeated .Sys.protobuf.Status ping = 7;
  optional .Sys.protobuf.Status trace_route = 8;
  optional .Sys.protobuf.Status check_packet = 9;
  optional .Sys.protobuf.Status reboot = 10;
  optional .Sys.protobuf.Status check_pkg = 11;
}
enum State {
  State_None = 0;
  State_Checking = 1;
  State_NG = 2;
  State_OK = 3;
}

