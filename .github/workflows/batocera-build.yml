name: 🎮 Batocera Build

# A push to rawthrills builds linuxloader-batocera.tar.gz (artifact). A
# linux-v* tag also stamps version.h from the tag and publishes the build as
# that tag's release (linuxloader-linux.tar.gz). Windows releases use plain
# v* tags, on rawthrills-windows.
on:
  workflow_dispatch:
  push:
    branches:
      - rawthrills
    tags:
      - 'linux-v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  batocera-loader:
    name: "Build (Batocera v43)"
    # glibc 2.35, below Batocera v43's 2.40
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/install-packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install Packages
      run: scripts/appimage/install-packages.sh

    - name: Version from Tag
      if: startsWith(github.ref, 'refs/tags/linux-v')
      run: scripts/set-version.sh "${GITHUB_REF_NAME#linux-v}"

    - name: Build Deps
      run: scripts/appimage/build-deps.sh

    - name: Compile Build for Batocera
      shell: bash
      run: scripts/linux/make-batocera.sh

    - name: Upload linuxloader-batocera.tar.gz artifact
      uses: actions/upload-artifact@v4
      with:
        name: "batocera-build"
        path: "linuxloader-batocera.tar.gz"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/linux-v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp linuxloader-batocera.tar.gz linuxloader-linux.tar.gz
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "Linux $GITHUB_REF_NAME" \
          --generate-notes \
          linuxloader-linux.tar.gz
